<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L-reader - 测试页面</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: monospace;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }

        button:hover {
            background: #0056b3;
        }

        #fileInput {
            margin: 20px 0;
        }

        #pdfContainer {
            margin-top: 20px;
            border: 1px solid #ddd;
            min-height: 400px;
            background: #fafafa;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🧪 L-reader PDF 加载测试</h1>

        <div id="status"></div>

        <div>
            <input type="file" id="fileInput" accept=".pdf">
            <button onclick="testPDFLoad()">测试加载PDF</button>
            <button onclick="clearCache()">清除本地缓存</button>
        </div>

        <div id="pdfContainer"></div>
    </div>

    <!-- 直接从CDN加载PDF.js，避免任何缓存问题 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script>
        const statusDiv = document.getElementById('status');

        function addStatus(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = message;
            statusDiv.appendChild(div);
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        // 配置PDF.js
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            addStatus('✅ PDF.js 加载成功 (版本: 3.11.174)', 'success');
        } else {
            addStatus('❌ PDF.js 加载失败', 'error');
        }

        async function testPDFLoad() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!file) {
                addStatus('⚠️ 请先选择一个PDF文件', 'error');
                return;
            }

            addStatus(`📄 开始加载: ${file.name}`, 'info');

            try {
                // 读取文件
                const arrayBuffer = await file.arrayBuffer();
                addStatus(`✅ 文件读取成功 (${arrayBuffer.byteLength} bytes)`, 'success');

                // 加载PDF
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                const pdf = await loadingTask.promise;
                addStatus(`✅ PDF加载成功 (${pdf.numPages} 页)`, 'success');

                // 渲染第一页
                const page = await pdf.getPage(1);
                const viewport = page.getViewport({ scale: 1.5 });

                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };

                await page.render(renderContext).promise;
                addStatus('✅ 第一页渲染成功', 'success');

                // 显示PDF
                const container = document.getElementById('pdfContainer');
                container.innerHTML = '';
                container.appendChild(canvas);

            } catch (error) {
                addStatus(`❌ 错误: ${error.message}`, 'error');
                console.error('详细错误:', error);
            }
        }

        function clearCache() {
            // 清除IndexedDB
            indexedDB.deleteDatabase('LReaderFiles');
            indexedDB.deleteDatabase('LReaderStorage');

            // 清除localStorage
            localStorage.clear();
            sessionStorage.clear();

            addStatus('✅ 本地缓存已清除', 'success');
            addStatus('ℹ️ 请刷新页面以完全清除浏览器缓存', 'info');
        }

        // 页面加载时的初始检查
        window.addEventListener('load', () => {
            addStatus('🚀 测试页面已加载', 'info');
            addStatus(`📍 当前URL: ${window.location.href}`, 'info');
            addStatus(`🌐 User Agent: ${navigator.userAgent}`, 'info');
        });
    </script>
</body>

</html>
