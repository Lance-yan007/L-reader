<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://generativelanguage.googleapis.com https://cdn.jsdelivr.net;">
    <title>L-reader - 阅读器</title>
    <link rel="stylesheet" href="styles/reader.css">
    <!-- Supabase Removed for Web Version -->
    <script>
        // Mock Supabase client to prevent errors
        window.supabaseClient = {
            auth: {
                getUser: async () => ({ data: { user: null }, error: null }),
                onAuthStateChange: () => ({ data: { subscription: { unsubscribe: () => { } } } }),
                signOut: async () => ({ error: null })
            },
            from: () => ({
                select: () => ({
                    eq: () => ({
                        single: async () => ({ data: null, error: null }),
                        data: [],
                        error: null
                    })
                })
            })
        };
        console.log('Supabase disabled for web version');
    </script>
    <!-- 加载Web适配层 -->
    <script src="../web-utils/web-fs-adapter.js"></script>
    <script src="../web-utils/web-storage-adapter.js"></script>
    <script src="../web-utils/web-ipc-adapter.js"></script>
    <script src="../web-utils/web-pdf-adapter.js"></script>
</head>

<body>
    <div class="reader-container">
        <!-- 顶部工具栏 -->
        <header class="toolbar">
            <div class="toolbar-left">
                <button class="btn btn-icon" id="backToMainBtn" title="返回主界面">
                    <svg viewBox="0 0 24 24">
                        <path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z" />
                    </svg>
                </button>
                <div class="file-info">
                    <span class="file-name" id="currentFileName">未命名文档</span>
                    <span class="file-status" id="fileStatus">就绪</span>
                </div>
            </div>
            <div class="toolbar-center">
                <div class="zoom-controls">
                    <button class="btn btn-icon" id="zoomOutBtn" title="缩小">
                        <svg viewBox="0 0 24 24">
                            <path d="M19,13H5V11H19V13Z" />
                        </svg>
                    </button>
                    <span class="zoom-level" id="zoomLevel">100%</span>
                    <button class="btn btn-icon" id="zoomInBtn" title="放大">
                        <svg viewBox="0 0 24 24">
                            <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="toolbar-right">
                <!-- 撤销按钮 -->
                <button class="btn btn-icon btn-disabled" id="undoBtn" title="撤销 (Ctrl+Z)" disabled>
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12.5,8C9.85,8 7.45,9 5.6,10.6L2,7V16H11L7.38,12.38C8.77,11.22 10.54,10.5 12.5,10.5C16.04,10.5 19.05,12.81 20.1,16L22.47,15.22C21.08,11.03 17.15,8 12.5,8Z" />
                    </svg>
                </button>
                <!-- 重做按钮 -->
                <button class="btn btn-icon btn-disabled" id="redoBtn" title="重做 (Ctrl+Y)" disabled>
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M18.4,10.6C16.55,9 14.15,8 11.5,8C6.85,8 2.92,11.03 1.54,15.22L3.9,16C4.95,12.81 7.95,10.5 11.5,10.5C13.45,10.5 15.23,11.22 16.62,12.38L13,16H22V7L18.4,10.6Z" />
                    </svg>
                </button>
                <!-- 保存按钮 -->
                <button class="btn btn-icon btn-disabled" id="saveBtn" title="保存标注 (Ctrl+S)" disabled>
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M15,9H5V5H15M12,19A3,3 0 0,1 9,16A3,3 0 0,1 12,13A3,3 0 0,1 15,16A3,3 0 0,1 12,19M17,3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V7L17,3Z" />
                    </svg>
                </button>
                <button class="btn btn-icon" id="wordTranslateBtn" title="点词翻译">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12.87,15.07L10.33,12.56L10.36,12.53C12.1,10.59 13.34,8.36 14.07,6H17V4H10V2H8V4H1V6H12.17C11.5,7.92 10.44,9.75 9,11.35C8.07,10.32 7.3,9.19 6.69,8H4.69C5.42,9.63 6.42,11.17 7.67,12.56L2.58,17.58L4,19L9,14L12.11,17.11L12.87,15.07M18.5,10H16.5L12,22H14L15.12,19H19.87L21,22H23L18.5,10M15.88,17L17.5,12.67L19.12,17H15.88Z" />
                    </svg>
                </button>
                <button class="btn btn-icon" id="fullscreenBtn" title="全屏">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M5,5H10V7H7V10H5V5M14,5H19V10H17V7H14V5M17,14H19V19H14V17H17V14M10,17V19H5V14H7V17H10Z" />
                    </svg>
                </button>
                <button class="btn btn-icon" id="settingsBtn" title="设置">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.22,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.22,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.68 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- 主内容区域 -->
        <div class="main-content">
            <!-- 文档显示区域 -->
            <main class="document-area">
                <div class="document-container" id="documentContainer">
                    <!-- 文档内容将在这里渲染 -->
                    <div class="loading" id="loadingIndicator">
                        <div class="loading-spinner"></div>
                        <p>正在加载文档...</p>
                    </div>
                </div>
            </main>
        </div>

        <!-- 底部状态栏 -->
        <footer class="status-bar">
            <div class="status-left">
                <span id="pageInfo">第 1 页，共 1 页</span>
            </div>
            <div class="status-center">
                <div class="highlight-tools" id="highlightTools" style="display: none;">
                    <button class="btn btn-sm" id="translateBtn">翻译选中文本</button>
                    <button class="btn btn-sm" id="addNoteBtn">添加注释</button>
                    <button class="btn btn-sm" id="highlightBtn">高亮显示</button>
                </div>
            </div>
            <div class="status-right">
                <span id="selectionInfo"></span>
            </div>
        </footer>

        <!-- AI对话按钮（右下角） -->
        <button class="ai-chat-button" id="aiChatButton" title="AI对话">
            <svg viewBox="0 0 100 100" width="40" height="40" xmlns="http://www.w3.org/2000/svg">
                <!-- 圆形白色背景 -->
                <circle cx="50" cy="50" r="45" fill="#ffffff" />

                <!-- 字母L（黑色艺术字） -->
                <text x="50" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="bold"
                    text-anchor="middle" fill="#000000"
                    style="font-variant-numeric: normal; font-variant-east-asian: normal; font-variant-alternates: normal; font-variant-position: normal; font-stretch: normal; line-height: normal; letter-spacing: 0;">L</text>
            </svg>
        </button>

        <!-- AI对话面板（右侧） -->
        <div class="ai-chat-panel" id="aiChatPanel">
            <div class="ai-chat-header">
                <div class="ai-chat-header-left">
                    <h3>L-reader AI</h3>
                    <span class="ai-chat-model">Gemini 2.0 Flash</span>
                </div>
                <button class="ai-chat-close" id="aiChatClose">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path
                            d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z"
                            fill="currentColor" />
                    </svg>
                </button>
            </div>
            <div class="ai-chat-messages" id="aiChatMessages">
                <div class="ai-chat-welcome">
                    <p>欢迎使用 L-reader AI</p>
                </div>
            </div>
            <div class="ai-chat-input-container">
                <textarea class="ai-chat-input" id="aiChatInput" placeholder="输入你的问题..." rows="1"></textarea>
                <button class="ai-chat-send" id="aiChatSend" title="发送">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path d="M2,21L23,12L2,3V10L17,12L2,14V21Z" fill="currentColor" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- 翻译弹窗 -->
    <div class="modal" id="translationModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>AI翻译</h3>
                <button class="btn btn-icon" id="closeTranslationModal">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="translation-content">
                    <div class="original-text">
                        <h4>原文：</h4>
                        <p id="originalText"></p>
                    </div>
                    <div class="translated-text">
                        <h4>翻译：</h4>
                        <p id="translatedText"></p>
                    </div>
                </div>
                <div class="translation-actions">
                    <button class="btn btn-primary" id="saveTranslationBtn">保存翻译</button>
                    <button class="btn btn-secondary" id="copyTranslationBtn">复制翻译</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 注释弹窗 -->
    <div class="modal" id="noteModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加注释</h3>
                <button class="btn btn-icon" id="closeNoteModal">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="note-content">
                    <div class="selected-text">
                        <h4>选中文本：</h4>
                        <p id="selectedTextForNote"></p>
                    </div>
                    <div class="note-input">
                        <h4>注释内容：</h4>
                        <textarea id="noteTextarea" placeholder="请输入您的注释..."></textarea>
                    </div>
                </div>
                <div class="note-actions">
                    <button class="btn btn-primary" id="saveNoteBtn">保存注释</button>
                    <button class="btn btn-secondary" id="cancelNoteBtn">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 点词翻译悬浮框 -->
    <div class="word-tooltip" id="wordTooltip" style="display: none;">
        <div class="word-tooltip-content">
            <div class="word-tooltip-word" id="tooltipWord"></div>
            <div class="word-tooltip-translation" id="tooltipTranslation"></div>
        </div>
    </div>

    <!-- 右键菜单 -->
    <div class="context-menu" id="contextMenu">
        <!-- 当前高亮颜色圆形 -->
        <div class="current-color-circle" id="currentColorCircle" title="选择颜色">
            <div class="current-color-fill"></div>
        </div>

        <!-- 透明度调节按钮 -->
        <button class="context-btn" id="opacityBtn" title="调节透明度">
            <svg viewBox="0 0 24 24" width="18" height="18">
                <rect x="4" y="4" width="6" height="6" fill="currentColor" opacity="0.3" />
                <rect x="10" y="4" width="6" height="6" fill="currentColor" opacity="0.5" />
                <rect x="16" y="4" width="4" height="6" fill="currentColor" opacity="0.7" />
                <rect x="4" y="10" width="6" height="6" fill="currentColor" opacity="0.5" />
                <rect x="10" y="10" width="6" height="6" fill="currentColor" opacity="0.7" />
                <rect x="16" y="10" width="4" height="6" fill="currentColor" opacity="0.9" />
                <rect x="4" y="16" width="6" height="4" fill="currentColor" opacity="0.7" />
                <rect x="10" y="16" width="6" height="4" fill="currentColor" opacity="0.9" />
                <rect x="16" y="16" width="4" height="4" fill="currentColor" />
            </svg>
        </button>

        <!-- 句子翻译按钮 -->
        <button class="context-btn" id="sentenceTranslateBtn" title="翻译选中句子">
            <svg viewBox="0 0 24 24" width="18" height="18">
                <path
                    d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"
                    fill="currentColor" />
            </svg>
        </button>


        <!-- 下划线按钮 -->
        <button class="context-btn" id="underlineBtn" title="下划线">
            <svg viewBox="0 0 24 24" width="18" height="18">
                <text x="12" y="14" text-anchor="middle" font-size="14" font-weight="bold" fill="currentColor">U</text>
                <line x1="6" y1="20" x2="18" y2="20" stroke="currentColor" stroke-width="2" />
            </svg>
        </button>

        <!-- 复制文本按钮 -->
        <button class="context-btn" id="copyTextBtn" title="复制文本">
            <svg viewBox="0 0 24 24" width="18" height="18">
                <rect x="8" y="8" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" rx="2" />
                <path d="M4 4h12v2H6v10H4V4z" fill="currentColor" />
            </svg>
        </button>

        <!-- 删除所有标记按钮 -->
        <button class="context-btn danger-btn" id="clearMarksBtn" title="删除所有标记">
            <svg viewBox="0 0 24 24" width="18" height="18">
                <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"
                    fill="currentColor" />
            </svg>
        </button>
    </div>

    <!-- 颜色选择器面板 -->
    <div class="color-picker-panel" id="colorPickerPanel">
        <div class="color-grid">
            <!-- 第一行：紫色系 -->
            <div class="color-option" data-color="#CDBBEB" style="background-color: #CDBBEB;"></div>
            <div class="color-option" data-color="#FADADD" style="background-color: #FADADD;"></div>
            <div class="color-option" data-color="#FFE4B5" style="background-color: #FFE4B5;"></div>
            <div class="color-option" data-color="#C8E6C9" style="background-color: #C8E6C9;"></div>
            <div class="color-option" data-color="#B3E5FC" style="background-color: #B3E5FC;"></div>
            <div class="color-option" data-color="#BBDEFB" style="background-color: #BBDEFB;"></div>

            <!-- 第二行：暖色系 -->
            <div class="color-option" data-color="#FF6B6B" style="background-color: #FF6B6B;"></div>
            <div class="color-option" data-color="#FFA07A" style="background-color: #FFA07A;"></div>
            <div class="color-option" data-color="#FFDAB9" style="background-color: #FFDAB9;"></div>
            <div class="color-option" data-color="#F0E68C" style="background-color: #F0E68C;"></div>
            <div class="color-option" data-color="#E6F3A0" style="background-color: #E6F3A0;"></div>
            <div class="color-option" data-color="#87CEEB" style="background-color: #87CEEB;"></div>

            <!-- 第三行：粉色系 -->
            <div class="color-option" data-color="#F4B6C2" style="background-color: #F4B6C2;"></div>
            <div class="color-option" data-color="#F8C4D8" style="background-color: #F8C4D8;"></div>
            <div class="color-option" data-color="#FFE4E1" style="background-color: #FFE4E1;"></div>
            <div class="color-option" data-color="#FFF8DC" style="background-color: #FFF8DC;"></div>
            <div class="color-option" data-color="#D5E8D4" style="background-color: #D5E8D4;"></div>
            <div class="color-option" data-color="#B8D8E8" style="background-color: #B8D8E8;"></div>

            <!-- 第四行：蓝紫色系 -->
            <div class="color-option" data-color="#B19CD9" style="background-color: #B19CD9;"></div>
            <div class="color-option" data-color="#C5B4E3" style="background-color: #C5B4E3;"></div>
            <div class="color-option" data-color="#D8BFD8" style="background-color: #D8BFD8;"></div>
            <div class="color-option" data-color="#E0BBE4" style="background-color: #E0BBE4;"></div>
            <div class="color-option" data-color="#BCDCDB" style="background-color: #BCDCDB;"></div>
            <div class="color-option-custom" id="customColorOption">
                <input type="color" id="customColorInput" value="#CDBBEB">
                <div class="rainbow-circle"></div>
            </div>
        </div>
    </div>

    <!-- 透明度滑块面板 -->
    <div class="opacity-slider-panel" id="opacitySliderPanel">
        <div class="opacity-slider-container">
            <div class="opacity-label">透明度</div>
            <input type="range" id="opacitySlider" class="opacity-slider" min="10" max="90" value="50" step="5">
            <div class="opacity-value" id="opacityValue">50%</div>
        </div>
    </div>

    <!-- 保存确认对话框 -->
    <div class="save-confirm-dialog" id="saveConfirmDialog" style="display: none;">
        <div class="save-confirm-overlay"></div>
        <div class="save-confirm-content">
            <div class="save-confirm-header">
                <svg viewBox="0 0 24 24" width="24" height="24" style="color: #f39c12;">
                    <path fill="currentColor" d="M13,14H11V10H13M13,18H11V16H13M1,21H23L12,2L1,21Z" />
                </svg>
                <h3>保存更改？</h3>
            </div>
            <div class="save-confirm-body">
                <p>您有未保存的更改。是否要保存？</p>
            </div>
            <div class="save-confirm-actions">
                <button class="btn btn-secondary" id="saveConfirmCancel">取消</button>
                <button class="btn btn-secondary" id="saveConfirmDontSave">不保存</button>
                <button class="btn btn-primary" id="saveConfirmSave">保存</button>
            </div>
        </div>
    </div>

    <!-- AI对话按钮 -->
    <button class="ai-chat-button" id="aiChatButton" title="AI助手" style="display: none;">
        <svg viewBox="0 0 24 24" width="24" height="24">
            <path fill="currentColor"
                d="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4M12,6A6,6 0 0,1 18,12A6,6 0 0,1 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6M12,8A4,4 0 0,0 8,12A4,4 0 0,0 12,16A4,4 0 0,0 16,12A4,4 0 0,0 12,8Z" />
        </svg>
    </button>

    <!-- AI对话面板 -->
    <div class="ai-chat-panel" id="aiChatPanel">
        <div class="ai-chat-header">
            <div class="ai-chat-header-left">
                <h3>AI助手</h3>
                <div class="ai-chat-model">GPT-4</div>
            </div>
            <button class="ai-chat-close" id="aiChatClose">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path fill="currentColor"
                        d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z" />
                </svg>
            </button>
        </div>
        <div class="ai-chat-messages" id="aiChatMessages">
            <div class="ai-chat-welcome">
                <p>你好！我是你的AI阅读助手。我可以帮你总结文档、解释概念或回答相关问题。</p>
            </div>
        </div>
