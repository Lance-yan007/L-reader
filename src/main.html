<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://xgdfwbqcjmjxdsxvmgot.supabase.co https://cdn.jsdelivr.net;">
    <title>L-reader - 主界面</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="app-shell">
        <div class="window-chrome">
            <div class="window-chrome-left"></div>
            <div class="window-tabbar">
                <div class="tab-strip" id="tabStrip" role="tablist" aria-label="文档标签"></div>
                <button class="tab-add-btn" id="tabAddButton" type="button" aria-label="新建标签">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19 13H13v6h-2v-6H5v-2h6V5h2v6h6z" />
                    </svg>
                </button>
            </div>
            <div class="window-chrome-right"></div>
        </div>

        <div class="app-layout">
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-inner">
                    <div class="sidebar-header">
                        <button class="sidebar-toggle" id="collapseSidebarBtn" type="button" aria-label="折叠左侧导航">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M4 4h10v16H4V4zm12 0h4v16h-4V4z" />
                            </svg>
                        </button>
                        <span class="sidebar-title">L-reader</span>
                    </div>
                    <div class="sidebar-search">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5 1.5-1.5-5-5zm-5 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z" />
                        </svg>
                        <input type="search" id="librarySearchInput" placeholder="搜索" autocomplete="off">
                    </div>

                    <nav class="sidebar-nav">
                        <button class="nav-item active" id="homeNavBtn" type="button">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M12 4l8 7h-3v9h-4v-5H11v5H7v-9H4z" />
                                </svg>
                            </span>
                            <span class="nav-label">主页</span>
                        </button>
                        <button class="nav-item" id="vocabularyNavBtn" type="button">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z" />
                                </svg>
                            </span>
                            <span class="nav-label">生词本</span>
                        </button>
                    </nav>

                    <!-- 个人中心入口（固定在底部） -->
                    <div class="sidebar-footer">
                        <button class="nav-item nav-item-profile" id="profileNavBtn" type="button">
                            <span class="nav-icon">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                                </svg>
                            </span>
                            <span class="nav-label" id="profileNavLabel">个人中心</span>
                        </button>
                    </div>
                </div>
            </aside>

            <div class="sidebar-hover-zone" id="sidebarHoverZone"></div>

            <main class="content-area">
                <div id="homeView" class="tab-panel is-active" role="tabpanel" aria-labelledby="tab-home">
                    <header class="content-header">
                        <div class="content-header-text">
                            <h1>我的图书</h1>
                            <p>最近打开的文档会出现在这里。</p>
                        </div>
                        <div class="content-actions">
                            <button class="action-btn action-btn-primary" id="openFileBtn" type="button">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z" />
                                </svg>
                                打开文件
                            </button>
                            <button class="action-btn action-btn-secondary" id="openFolderBtn" type="button">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M10,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V8C22,6.89 21.1,6 20,6H12L10,4Z" />
                                </svg>
                                打开文件夹
                            </button>
                        </div>
                    </header>

                    <section class="welcome-section" id="welcomeSection">
                        <div class="welcome-card">
                            <div class="welcome-icon">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z" />
                                </svg>
                            </div>
                            <h2>欢迎使用 L-reader</h2>
                            <p>开启阅读旅程，支持 PDF、Word 等格式，点选即可开始学习。</p>
                        </div>
                    </section>

                    <section class="files-view" id="filesView" style="display: none;">
                        <div class="files-grid" id="filesGrid"></div>
                    </section>
                </div>
                <div id="vocabularyView" class="tab-panel" role="tabpanel" aria-labelledby="tab-vocabulary" style="display: none;">
                    <div class="vocabulary-panel-container">
                        <webview class="vocabulary-frame" id="vocabularyFrame" src="vocabulary.html" nodeintegration webpreferences="contextIsolation=false"></webview>
                    </div>
                </div>
                <div id="profileView" class="tab-panel" role="tabpanel" aria-labelledby="tab-profile" style="display: none;">
                    <div class="profile-panel-container">
                        <webview class="profile-frame" id="profileFrame" src="profile.html" nodeintegration webpreferences="contextIsolation=false"></webview>
                    </div>
                </div>
                <div id="documentPanels" class="tab-panels" aria-live="polite"></div>
            </main>
            </div>
    </div>

    <template id="fileCardTemplate">
        <div class="file-card" data-file-path="">
            <button class="file-card-menu-btn" type="button" aria-label="更多操作">
                <svg viewBox="0 0 24 24" width="16" height="16">
                    <circle cx="5" cy="12" r="2" fill="currentColor"/>
                    <circle cx="12" cy="12" r="2" fill="currentColor"/>
                    <circle cx="19" cy="12" r="2" fill="currentColor"/>
                </svg>
            </button>
            <div class="file-card-menu" role="menu">
                <button class="file-card-menu-item" data-action="rename" type="button" role="menuitem">
                    <svg viewBox="0 0 24 24" width="16" height="16">
                        <path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                    </svg>
                    <span>重命名</span>
                </button>
                <button class="file-card-menu-item" data-action="delete" type="button" role="menuitem">
                    <svg viewBox="0 0 24 24" width="16" height="16">
                        <path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                    </svg>
                    <span>删除</span>
                </button>
            </div>
            <div class="file-info-card">
                <div class="file-name-card"></div>
                <input type="text" class="file-name-input" style="display: none;" />
                <div class="file-meta-card">
                    <span class="file-date-card"></span>
                    <span class="file-size-card"></span>
                </div>
            </div>
            <div class="file-preview">
                <canvas class="preview-canvas"></canvas>
                <div class="preview-placeholder">
                    <svg viewBox="0 0 24 24" width="48" height="48">
                        <path fill="#c0c0c0" d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z" />
                    </svg>
                </div>
            </div>
        </div>
    </template>

    <script src="scripts/main.js"></script>
</body>
</html>
