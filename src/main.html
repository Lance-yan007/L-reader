<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';">
    <title>NPDF Reader - 主界面</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航栏 -->
        <header class="header">
            <div class="header-left">
                <h1 class="app-title">NPDF Reader</h1>
                <span class="app-subtitle">智能英文阅读器</span>
            </div>
            <div class="header-right">
                <button class="btn btn-primary" id="openFileBtn">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z" />
                    </svg>
                    打开文件
                </button>
                <button class="btn btn-secondary" id="openFolderBtn">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M10,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V8C22,6.89 21.1,6 20,6H12L10,4Z" />
                    </svg>
                    打开文件夹
                </button>
            </div>
        </header>

        <!-- 主内容区域 -->
        <main class="main-content">
            <!-- 欢迎区域 -->
            <div class="welcome-section" id="welcomeSection">
                <div class="welcome-content">
                    <div class="welcome-icon">
                        <svg viewBox="0 0 24 24" width="80" height="80">
                            <path fill="#4A90E2" d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z" />
                        </svg>
                    </div>
                    <h2>欢迎使用 NPDF Reader</h2>
                    <p>专为中国留学生设计的智能英文阅读器</p>
                    <div class="feature-list">
                        <div class="feature-item">
                            <svg class="feature-icon" viewBox="0 0 24 24">
                                <path d="M9,20.42L2.79,14.21L5.62,11.38L9,14.77L18.88,4.88L21.71,7.71L9,20.42Z" />
                            </svg>
                            <span>支持PDF、Word等多种格式</span>
                        </div>
                        <div class="feature-item">
                            <svg class="feature-icon" viewBox="0 0 24 24">
                                <path d="M9,20.42L2.79,14.21L5.62,11.38L9,14.77L18.88,4.88L21.71,7.71L9,20.42Z" />
                            </svg>
                            <span>智能AI翻译功能</span>
                        </div>
                        <div class="feature-item">
                            <svg class="feature-icon" viewBox="0 0 24 24">
                                <path d="M9,20.42L2.79,14.21L5.62,11.38L9,14.77L18.88,4.88L21.71,7.71L9,20.42Z" />
                            </svg>
                            <span>荧光笔和批注功能</span>
                        </div>
                        <div class="feature-item">
                            <svg class="feature-icon" viewBox="0 0 24 24">
                                <path d="M9,20.42L2.79,14.21L5.62,11.38L9,14.77L18.88,4.88L21.71,7.71L9,20.42Z" />
                            </svg>
                            <span>自动生成翻译记录</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 新的文件展示区域 -->
            <div class="files-view" id="filesView" style="display: none;">
                <!-- 外层深灰色容器 -->
                <div class="outer-container">
                    <!-- 标签栏："最近"和"收藏" -->
                    <div class="tabs-bar">
                        <button class="tab-item active" id="recentTab">最近</button>
                        <button class="tab-item" id="favoriteTab">收藏</button>
                    </div>
                    
                    <!-- 内层浅灰色容器 -->
                    <div class="inner-container">
                        <div class="files-grid" id="filesGrid">
                            <!-- 文件卡片将在这里动态生成 -->
                        </div>
                    </div>
                </div>
            </div>
        </main>

    </div>

    <!-- 文件卡片模板 -->
    <template id="fileCardTemplate">
        <div class="file-card" data-file-path="">
            <div class="file-preview">
                <canvas class="preview-canvas"></canvas>
                <div class="preview-placeholder">
                    <svg viewBox="0 0 24 24" width="48" height="48">
                        <path fill="#c0c0c0" d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z" />
                    </svg>
                </div>
            </div>
            <div class="file-info-card">
                <div class="file-name-card"></div>
                <div class="file-meta-card">
                    <span class="file-date-card"></span>
                    <span class="file-size-card"></span>
                </div>
            </div>
        </div>
    </template>

    <script src="scripts/main.js"></script>
</body>
</html>
