<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专注模式 - L-reader</title>
    <link rel="stylesheet" href="styles/study-card-new.css">
</head>

<body>
    <div class="study-card-container">
        <!-- Progress Bar -->
        <div class="session-progress">
            <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
        </div>

        <!-- Close Button -->
        <button class="close-btn">×</button>

        <!-- Main Card Area -->
        <div class="card-area" id="cardArea">
            <div class="context-card">
                <!-- Sentence Display -->
                <div class="sentence-display" id="sentenceDisplay">
                    Loading context...
                </div>

                <div class="book-source" id="bookSource">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z" />
                    </svg>
                    <span id="sourceText">Source</span>
                </div>

                <!-- Reveal Trigger Hint -->
                <div class="reveal-trigger" id="revealTrigger">
                    点击或按空格键查看答案
                </div>

                <!-- Reveal Section (Hidden initially) -->
                <div class="reveal-section" id="revealSection">
                    <div class="word-details">
                        <div class="phonetic" id="phonetic">/ ... /</div>
                        <div class="definition" id="definition">...</div>
                        <div class="mnemonic" id="mnemonic">💡 正在生成助记...</div>
                    </div>

                    <div class="action-buttons">
                        <button class="rate-btn btn-forgot" onclick="rateWord(1)">
                            <span class="label">忘记</span>
                            <span class="days">重来</span>
                        </button>
                        <button class="rate-btn btn-hard" onclick="rateWord(2)">
                            <span class="label">模糊</span>
                            <span class="days">1天后</span>
                        </button>
                        <button class="rate-btn btn-good" onclick="rateWord(3)">
                            <span class="label">认识</span>
                            <span class="days">3天后</span>
                        </button>
                        <button class="rate-btn btn-easy" onclick="rateWord(4)">
                            <span class="label">精通</span>
                            <span class="days">7天后</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Summary Card (Hidden initially) -->
        <div class="summary-card" id="summaryCard">
            <div class="context-card">
                <div class="summary-title">🎉 今日复习完成！</div>
                <p>您刚刚重温了阅读记忆，巩固了知识基石。</p>

                <div class="summary-stats">
                    <div class="summary-stat-item">
                        <div class="value" id="summaryCount">0</div>
                        <div class="label">单词</div>
                    </div>
                    <div class="summary-stat-item">
                        <div class="value" id="summaryAccuracy">100%</div>
                        <div class="label">熟练度</div>
                    </div>
                </div>

                <button class="finish-btn" onclick="window.history.back()">返回仪表盘</button>
            </div>
        </div>
    </div>

    <script src="scripts/study-card.js"></script>
</body>

</html>
