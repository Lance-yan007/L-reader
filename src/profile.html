<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://xgdfwbqcjmjxdsxvmgot.supabase.co https://cdn.jsdelivr.net;">
    <title>个人中心 - L-reader</title>
    <link rel="stylesheet" href="styles/profile.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        // 初始化 Supabase 客户端
        window.SUPABASE_CONFIG = {
            url: 'https://xgdfwbqcjmjxdsxvmgot.supabase.co',
            anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhnZGZ3YnFjam1qeGRzeHZtZ290Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIzNzk5MDgsImV4cCI6MjA3Nzk1NTkwOH0.YXHXZc71Ivl6WchD_1yNK7-wOVE0cxF5_uAqZCqR6Xw'
        };
        
        function initSupabaseClient() {
            if (typeof supabase !== 'undefined' && supabase.createClient && window.SUPABASE_CONFIG) {
                try {
                    window.supabaseClient = supabase.createClient(
                        window.SUPABASE_CONFIG.url,
                        window.SUPABASE_CONFIG.anonKey
                    );
                    console.log('✅ Supabase 客户端已初始化');
                    window.dispatchEvent(new CustomEvent('supabase-ready'));
                    return true;
                } catch (error) {
                    console.error('❌ 创建 Supabase 客户端失败:', error);
                    return false;
                }
            }
            return false;
        }
        
        if (!initSupabaseClient()) {
            let attempts = 0;
            const maxAttempts = 100;
            const checkInterval = setInterval(() => {
                attempts++;
                if (initSupabaseClient()) {
                    clearInterval(checkInterval);
                } else if (attempts >= maxAttempts) {
                    clearInterval(checkInterval);
                    console.error('❌ Supabase CDN 加载超时');
                }
            }, 100);
        }
    </script>
</head>
<body>
    <div class="profile-container">
        <div class="profile-header">
            <h1>个人中心</h1>
            <p>管理你的账号信息和设置</p>
        </div>

        <div class="profile-content">
            <!-- 用户信息卡片 -->
            <div class="profile-card">
                <div class="card-header">
                    <h2>账号信息</h2>
                </div>
                <div class="card-body">
                    <div class="info-item">
                        <label>邮箱</label>
                        <div class="info-value" id="userEmail">加载中...</div>
                    </div>
                    <div class="info-item">
                        <label>用户名</label>
                        <div class="info-value" id="userName">加载中...</div>
                    </div>
                    <div class="info-item">
                        <label>注册时间</label>
                        <div class="info-value" id="userCreatedAt">加载中...</div>
                    </div>
                </div>
            </div>

            <!-- 订阅管理卡片 -->
            <div class="profile-card subscription-card">
                <div class="card-header">
                    <h2>订阅管理</h2>
                </div>
                <div class="card-body">
                    <!-- 当前订阅状态 -->
                    <div class="subscription-status">
                        <div class="status-badge" id="subscriptionBadge">
                            <span class="badge-text" id="subscriptionType">免费版</span>
                        </div>
                        <div class="status-info" id="subscriptionInfo">
                            <div class="status-item">
                                <span class="status-label">到期时间</span>
                                <span class="status-value" id="subscriptionEndDate">-</span>
                            </div>
                        </div>
                    </div>

                    <!-- 使用量统计 -->
                    <div class="usage-stats" id="usageStats">
                        <div class="usage-item">
                            <div class="usage-header">
                                <span class="usage-label">点词翻译</span>
                                <span class="usage-count" id="wordTranslationUsage">-</span>
                            </div>
                            <div class="usage-progress">
                                <div class="usage-progress-bar" id="wordTranslationProgress"></div>
                            </div>
                        </div>
                        <div class="usage-item">
                            <div class="usage-header">
                                <span class="usage-label">AI助手</span>
                                <span class="usage-count" id="aiChatUsage">-</span>
                            </div>
                            <div class="usage-progress">
                                <div class="usage-progress-bar" id="aiChatProgress"></div>
                            </div>
                        </div>
                        <div class="usage-item">
                            <div class="usage-header">
                                <span class="usage-label">生词本</span>
                                <span class="usage-count" id="vocabularyUsage">-</span>
                            </div>
                            <div class="usage-progress">
                                <div class="usage-progress-bar" id="vocabularyProgress"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 操作按钮 -->
                    <div class="subscription-actions">
                        <button class="action-button action-button-primary" id="upgradeSubscriptionBtn">
                            <svg viewBox="0 0 24 24" width="20" height="20">
                                <path fill="currentColor" d="M7,15H9C9,16.08 10.37,17 12,17C13.63,17 15,16.08 15,15C15,13.9 13.96,13.5 11.76,12.97C9.64,12.44 7,11.78 7,9C7,7.21 8.47,5.69 10.5,5.18V3H13.5V5.18C15.53,5.69 17,7.21 17,9H15C15,7.92 13.63,7 12,7C10.37,7 9,7.92 9,9C9,10.1 10.04,10.5 12.24,11.03C14.36,11.56 17,12.22 17,15C17,16.79 15.53,18.31 13.5,18.82V21H10.5V18.82C8.47,18.31 7,16.79 7,15Z"/>
                            </svg>
                            <span id="upgradeButtonText">升级订阅</span>
                        </button>
                        <button class="action-button" id="manageSubscriptionBtn" style="display: none;">
                            <svg viewBox="0 0 24 24" width="20" height="20">
                                <path fill="currentColor" d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11.03L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.22,8.95 2.27,9.22 2.46,9.37L4.57,11.03C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.22,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.94C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.68 16.04,18.34 16.56,17.94L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z"/>
                            </svg>
                            管理订阅
                        </button>
                    </div>
                </div>
            </div>

            <!-- 操作卡片 -->
            <div class="profile-card">
                <div class="card-header">
                    <h2>账号操作</h2>
                </div>
                <div class="card-body">
                    <button class="action-button" id="changePasswordBtn">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path fill="currentColor" d="M12,1L8,5H11V14H13V5H16M18,23H6C4.89,23 4,22.1 4,21V9A2,2 0 0,1 6,7H9V9H6V21H18V9H15V7H18A2,2 0 0,1 20,9V21A2,2 0 0,1 18,23Z"/>
                        </svg>
                        修改密码
                    </button>
                    <button class="action-button action-button-danger" id="deleteAccountBtn">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path fill="currentColor" d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z"/>
                        </svg>
                        删除账号
                    </button>
                </div>
            </div>

            <!-- 阅读设置卡片 -->
            <div class="profile-card">
                <div class="card-header">
                    <h2>阅读设置</h2>
                </div>
                <div class="card-body">
                    <div class="setting-item">
                        <div class="setting-label">
                            <label>自动保存翻译</label>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" id="autoSaveTranslations" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <div class="setting-label">
                            <label>自动保存标注</label>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" id="autoSaveAnnotations" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 数据管理卡片 -->
            <div class="profile-card">
                <div class="card-header">
                    <h2>数据管理</h2>
                </div>
                <div class="card-body">
                    <button class="action-button" id="clearCacheBtn">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path fill="currentColor" d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z"/>
                        </svg>
                        清除缓存
                    </button>
                    <button class="action-button" id="exportDataBtn">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path fill="currentColor" d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/>
                        </svg>
                        导出数据
                    </button>
                    <button class="action-button" id="importDataBtn">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path fill="currentColor" d="M9,16V10H5L12,3L19,10H15V16H9M5,20V18H19V20H5Z"/>
                        </svg>
                        导入数据
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- 消息提示 -->
    <div class="message" id="errorMessage" style="display: none;"></div>

    <!-- 修改密码模态对话框 -->
    <div class="modal-overlay" id="changePasswordModal" style="display: none;">
        <div class="modal-dialog">
            <div class="modal-header">
                <h2>修改密码</h2>
                <button class="modal-close" id="closePasswordModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="changePasswordForm">
                    <div class="form-group">
                        <label for="currentPassword">当前密码</label>
                        <input type="password" id="currentPassword" required autocomplete="current-password">
                    </div>
                    <div class="form-group">
                        <label for="newPassword">新密码（至少6个字符）</label>
                        <input type="password" id="newPassword" required autocomplete="new-password" minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">确认新密码</label>
                        <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="6">
                    </div>
                    <div class="form-error" id="passwordFormError" style="display: none;"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="modal-btn modal-btn-cancel" id="cancelPasswordBtn">取消</button>
                <button type="button" class="modal-btn modal-btn-primary" id="submitPasswordBtn">确认修改</button>
            </div>
        </div>
    </div>

    <!-- 订阅升级模态对话框 -->
    <div class="modal-overlay" id="subscriptionModal" style="display: none;">
        <div class="modal-dialog modal-dialog-large">
            <div class="modal-header">
                <h2>升级订阅</h2>
                <button class="modal-close" id="closeSubscriptionModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="subscription-plans">
                    <!-- 月订阅 -->
                    <div class="plan-card" id="monthlyPlan">
                        <div class="plan-header">
                            <h3>月订阅</h3>
                            <div class="plan-price">
                                <span class="price-amount">¥39.9</span>
                                <span class="price-period">/月</span>
                            </div>
                        </div>
                        <div class="plan-features">
                            <div class="feature-item">
                                <svg viewBox="0 0 24 24" width="16" height="16">
                                    <path fill="currentColor" d="M9,20.42L2.79,14.21L5.62,11.38L9,14.77L18.88,4.88L21.71,7.71L9,20.42Z"/>
                                </svg>
                                <span>点词翻译：每日200次</span>
                            </div>
                            <div class="feature-item">
                                <svg viewBox="0 0 24 24" width="16" height="16">
                                    <path fill="currentColor" d="M9,20.42L2.79,14.21L5.62,11.38L9,14.77L18.88,4.88L21.71,7.71L9,20.42Z"/>
                                </svg>
                                <span>AI助手：每日50次</span>
                            </div>
                            <div class="feature-item">
                                <svg viewBox="0 0 24 24" width="16" height="16">
                                    <path fill="currentColor" d="M9,20.42L2.79,14.21L5.62,11.38L9,14.77L18.88,4.88L21.71,7.71L9,20.42Z"/>
                                </svg>
                                <span>生词本：最多500个单词</span>
                            </div>
                        </div>
                        <button class="plan-button" id="selectMonthlyPlan">选择月订阅</button>
                    </div>

                    <!-- 年订阅（推荐） -->
                    <div class="plan-card plan-card-featured" id="yearlyPlan">
                        <div class="plan-badge">推荐</div>
                        <div class="plan-header">
                            <h3>年订阅</h3>
                            <div class="plan-price">
                                <span class="price-amount">¥299</span>
                                <span class="price-period">/年</span>
                            </div>
                            <div class="plan-savings">相当于¥24.92/月，省¥179.8/年</div>
                        </div>
                        <div class="plan-features">
                            <div class="feature-item">
                                <svg viewBox="0 0 24 24" width="16" height="16">
                                    <path fill="currentColor" d="M9,20.42L2.79,14.21L5.62,11.38L9,14.77L18.88,4.88L21.71,7.71L9,20.42Z"/>
                                </svg>
                                <span>点词翻译：无限</span>
                            </div>
                            <div class="feature-item">
                                <svg viewBox="0 0 24 24" width="16" height="16">
                                    <path fill="currentColor" d="M9,20.42L2.79,14.21L5.62,11.38L9,14.77L18.88,4.88L21.71,7.71L9,20.42Z"/>
                                </svg>
                                <span>AI助手：无限</span>
                            </div>
                            <div class="feature-item">
                                <svg viewBox="0 0 24 24" width="16" height="16">
                                    <path fill="currentColor" d="M9,20.42L2.79,14.21L5.62,11.38L9,14.77L18.88,4.88L21.71,7.71L9,20.42Z"/>
                                </svg>
                                <span>生词本：无限</span>
                            </div>
                        </div>
                        <button class="plan-button plan-button-featured" id="selectYearlyPlan">选择年订阅</button>
                    </div>
                </div>
                <div class="subscription-note">
                    <p>💡 订阅后立即生效，支持7天无理由退款</p>
                    <p>💡 自动续费，可随时取消</p>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts/profile.js"></script>
</body>
</html>
