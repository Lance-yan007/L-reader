<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://xgdfwbqcjmjxdsxvmgot.supabase.co https://cdn.jsdelivr.net;">
    <title>生词本 - L-reader</title>
    <link rel="stylesheet" href="styles/vocabulary.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        // 初始化 Supabase 客户端
        window.SUPABASE_CONFIG = {
            url: 'https://xgdfwbqcjmjxdsxvmgot.supabase.co',
            anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhnZGZ3YnFjam1qeGRzeHZtZ290Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIzNzk5MDgsImV4cCI6MjA3Nzk1NTkwOH0.YXHXZc71Ivl6WchD_1yNK7-wOVE0cxF5_uAqZCqR6Xw'
        };
        
        function initSupabaseClient() {
            if (typeof supabase !== 'undefined' && supabase.createClient && window.SUPABASE_CONFIG) {
                try {
                    window.supabaseClient = supabase.createClient(
                        window.SUPABASE_CONFIG.url,
                        window.SUPABASE_CONFIG.anonKey
                    );
                    console.log('✅ Supabase 客户端已初始化');
                    window.dispatchEvent(new CustomEvent('supabase-ready'));
                    return true;
                } catch (error) {
                    console.error('❌ 创建 Supabase 客户端失败:', error);
                    return false;
                }
            }
            return false;
        }
        
        if (!initSupabaseClient()) {
            let attempts = 0;
            const maxAttempts = 100;
            const checkInterval = setInterval(() => {
                attempts++;
                if (initSupabaseClient()) {
                    clearInterval(checkInterval);
                } else if (attempts >= maxAttempts) {
                    clearInterval(checkInterval);
                    console.error('❌ Supabase CDN 加载超时');
                }
            }, 100);
        }
    </script>
</head>
<body>
    <div class="vocabulary-container">
        <!-- 顶部标题栏 -->
        <header class="vocabulary-header">
            <h1 class="vocabulary-title" id="vocabularyTitle">生词本</h1>
            <div class="vocabulary-header-actions">
                <!-- 编辑模式工具栏 -->
                <div class="edit-toolbar" id="editToolbar" style="display: none;">
                    <button class="btn btn-text" id="selectAllBtn" title="全选">
                        <span>全选</span>
                    </button>
                    <button class="btn btn-icon btn-danger" id="deleteSelectedBtn" title="删除选中">
                        <svg viewBox="0 0 24 24">
                            <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="currentColor"/>
                        </svg>
                    </button>
                    <button class="btn btn-text" id="cancelEditBtn" title="取消">
                        <span>取消</span>
                    </button>
                </div>
                <!-- 普通模式工具栏 -->
                <div class="normal-toolbar" id="normalToolbar">
                    <button class="btn btn-text" id="editBtn" title="编辑">
                        <span>编辑</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- 主内容区域 -->
        <main class="vocabulary-content">
            <!-- 加载状态 -->
            <div class="loading-state" id="loadingState">
                <div class="loading-spinner"></div>
                <p>正在加载生词本...</p>
            </div>

            <!-- 空状态 -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <svg viewBox="0 0 24 24" width="64" height="64">
                    <path fill="#c0c0c0" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z" />
                </svg>
                <h2>还没有生词</h2>
                <p>使用点词翻译功能时，翻译的单词会自动保存到这里</p>
            </div>

            <!-- 生词卡片列表 -->
            <div class="vocabulary-list" id="vocabularyList" style="display: none;"></div>
        </main>
    </div>

    <script src="../utils/subscription-helper.js"></script>
    <script src="scripts/vocabulary.js"></script>
</body>
</html>
