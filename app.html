<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L-reader - 智能英文阅读器</title>
    <link rel="stylesheet" href="src/styles/main.css">
    <link rel="stylesheet" href="src/styles/reader.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="src/scripts/config.js"></script>
    <script>
        // Initialize Supabase client
        if (typeof supabase !== 'undefined' && supabase.createClient && window.AppConfig) {
            window.supabaseClient = supabase.createClient(
                window.AppConfig.supabase.url,
                window.AppConfig.supabase.anonKey
            );
            console.log('✅ Supabase client initialized');

            // Enforce login: check session and redirect if needed
            window.supabaseClient.auth.getSession().then(({ data: { session } }) => {
                if (!session) {
                    console.log('⚠️ No active session, redirecting to login...');
                    window.location.href = 'src/auth.html';
                }
            });

            // Listen for auth state changes
            window.supabaseClient.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_OUT' || !session) {
                    window.location.href = 'src/auth.html';
                }
            });
        } else {
            console.warn('⚠️ Supabase SDK not loaded, running in offline mode');
            // Fallback to mock client for offline mode
            window.supabaseClient = {
                auth: {
                    getUser: async () => ({ data: { user: null }, error: null }),
                    getSession: async () => ({ data: { session: null }, error: null }),
                    onAuthStateChange: () => ({ data: { subscription: { unsubscribe: () => { } } } }),
                    signOut: async () => ({ error: null })
                },
                from: () => ({
                    select: () => ({
                        eq: () => ({
                            single: async () => ({ data: null, error: null }),
                            data: [],
                            error: null
                        })
                    })
                })
            };
        }
    </script>
</head>

<body>
    <div id="app-root">
        <!-- Version Indicator for Debugging -->
        <div style="position: fixed; bottom: 5px; right: 5px; font-size: 10px; color: #aaa; z-index: 9999;">v2.2 (Fix
            Crash)</div>

        <!-- Sidebar -->
    </div>

    <!-- 加载Web适配层 -->
    <script src="web-utils/web-fs-adapter.js"></script>
    <script src="web-utils/web-storage-adapter.js"></script>
    <script src="web-utils/web-ipc-adapter.js"></script>
    <script src="web-utils/web-pdf-adapter.js"></script>

    <!-- 加载应用脚本 -->
    <script>
        // Add timestamp to prevent caching
        const script = document.createElement('script');
        script.src = `web-loader.js?v=${Date.now()}`;
        document.body.appendChild(script);
    </script>
</body>

</html>
