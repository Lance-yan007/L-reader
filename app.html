<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L-reader - 智能英文阅读器</title>
    <link rel="stylesheet" href="src/styles/main.css">
    <link rel="stylesheet" href="src/styles/reader.css">
    <!-- Working Version: Using mock Supabase (no authentication) -->
    <script>
        // Mock Supabase client to prevent errors
        window.supabaseClient = {
            auth: {
                getUser: async () => ({ data: { user: null }, error: null }),
                onAuthStateChange: () => ({ data: { subscription: { unsubscribe: () => { } } } }),
                signOut: async () => ({ error: null })
            },
            from: () => ({
                select: () => ({
                    eq: () => ({
                        single: async () => ({ data: null, error: null }),
                        data: [],
                        error: null
                    })
                })
            })
        };
        console.log('Supabase disabled for web version');
    </script>
</head>

<body>
    <div id="app-root"></div>

    <!-- 加载Web适配层 -->
    <script src="web-utils/web-fs-adapter.js"></script>
    <script src="web-utils/web-storage-adapter.js"></script>
    <script src="web-utils/web-ipc-adapter.js"></script>
    <script src="web-utils/web-pdf-adapter.js"></script>

    <!-- 加载应用脚本 -->
    <script>
        // Add timestamp to prevent caching
        const script = document.createElement('script');
        script.src = `web-loader.js?v=${Date.now()}`;
        document.body.appendChild(script);
    </script>
</body>

</html>
