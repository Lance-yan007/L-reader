<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L-reader - 智能英文阅读器</title>
    <link rel="stylesheet" href="src/styles/main.css">
    <link rel="stylesheet" href="src/styles/reader.css">
    <!-- Load Configuration -->
    <script src="src/scripts/config.js"></script>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        // Initialize Supabase Client
        try {
            if (window.AppConfig && window.AppConfig.supabase && window.supabase) {
                window.supabaseClient = window.supabase.createClient(
                    window.AppConfig.supabase.url,
                    window.AppConfig.supabase.anonKey
                );
                console.log('✅ Supabase initialized in App');
            } else {
                console.warn('⚠️ Supabase configuration missing or SDK not loaded');
            }
        } catch (error) {
            console.error('❌ Failed to initialize Supabase:', error);
        }
    </script>
</head>

<body>
    <div id="app-root"></div>

    <!-- 加载Web适配层 -->
    <script src="web-utils/web-fs-adapter.js"></script>
    <script src="web-utils/web-storage-adapter.js"></script>
    <script src="web-utils/web-ipc-adapter.js"></script>
    <script src="web-utils/web-pdf-adapter.js"></script>

    <!-- 加载应用脚本 -->
    <script>
        // Add timestamp to prevent caching
        const script = document.createElement('script');
        script.src = `web-loader.js?v=${Date.now()}`;
        document.body.appendChild(script);
    </script>
</body>

</html>
