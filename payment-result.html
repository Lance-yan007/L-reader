<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付结果 - L-reader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .result-container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .success-icon {
            color: #52c41a;
        }

        .fail-icon {
            color: #ff4d4f;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #333;
        }

        p {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 14px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .order-info {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
        }

        .order-info p {
            margin: 8px 0;
            font-size: 14px;
            color: #666;
        }

        .order-info strong {
            color: #333;
        }
    </style>
</head>

<body>
    <div class="result-container" id="resultContainer">
        <!-- Content will be injected by JavaScript -->
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const status = urlParams.get('status');
        const container = document.getElementById('resultContainer');

        if (status === 'success') {
            container.innerHTML = `
                <div class="icon success-icon">✓</div>
                <h1>支付成功！</h1>
                <p>
                    感谢您的购买！您的 L-reader Pro 订阅已激活。<br>
                    订阅权益将在几分钟内生效，请稍后刷新页面查看。
                </p>
                <div class="order-info">
                    <p><strong>温馨提示：</strong></p>
                    <p>• 请妥善保管您的支付凭证</p>
                    <p>• 如有疑问，请联系客服</p>
                    <p>• 订阅信息可在个人中心查看</p>
                </div>
                <a href="/app.html" class="btn">返回首页</a>
            `;
        } else if (status === 'fail') {
            container.innerHTML = `
                <div class="icon fail-icon">✗</div>
                <h1>支付失败</h1>
                <p>
                    很抱歉，支付未能完成。<br>
                    请检查您的账户余额或重试。
                </p>
                <div class="order-info">
                    <p><strong>可能的原因：</strong></p>
                    <p>• 账户余额不足</p>
                    <p>• 支付超时</p>
                    <p>• 网络连接问题</p>
                </div>
                <a href="/index.html" class="btn">重新支付</a>
            `;
        } else {
            container.innerHTML = `
                <div class="icon">?</div>
                <h1>未知状态</h1>
                <p>无法确认支付结果，请联系客服确认。</p>
                <a href="/app.html" class="btn">返回首页</a>
            `;
        }
    </script>
</body>

</html>
