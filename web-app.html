<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L-reader - 智能英文阅读器</title>
    <link rel="stylesheet" href="src/styles/main.css">
    <link rel="stylesheet" href="src/styles/reader.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        // 初始化 Supabase 客户端
        window.SUPABASE_CONFIG = {
            url: 'https://xgdfwbqcjmjxdsxvmgot.supabase.co',
            anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhnZGZ3YnFjam1qeGRzeHZtZ290Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIzNzk5MDgsImV4cCI6MjA3Nzk1NTkwOH0.YXHXZc71Ivl6WchD_1yNK7-wOVE0cxF5_uAqZCqR6Xw'
        };
        
        function initSupabaseClient() {
            if (typeof supabase !== 'undefined' && supabase.createClient && window.SUPABASE_CONFIG) {
                try {
                    window.supabaseClient = supabase.createClient(
                        window.SUPABASE_CONFIG.url,
                        window.SUPABASE_CONFIG.anonKey
                    );
                    console.log('✅ Supabase 客户端已初始化');
                    window.dispatchEvent(new CustomEvent('supabase-ready'));
                    return true;
                } catch (error) {
                    console.error('❌ 创建 Supabase 客户端失败:', error);
                    return false;
                }
            }
            return false;
        }
        
        if (!initSupabaseClient()) {
            let attempts = 0;
            const maxAttempts = 100;
            const checkInterval = setInterval(() => {
                attempts++;
                if (initSupabaseClient()) {
                    clearInterval(checkInterval);
                } else if (attempts >= maxAttempts) {
                    clearInterval(checkInterval);
                    console.error('❌ Supabase CDN 加载超时');
                }
            }, 100);
        }
    </script>
</head>
<body>
    <div id="app-root"></div>
    
    <!-- 加载Web适配层 -->
    <script src="web-utils/file-system-adapter.js"></script>
    <script src="web-utils/storage-adapter.js"></script>
    <script src="web-utils/ipc-adapter.js"></script>
    <script src="web-utils/pdfjs-adapter.js"></script>
    
    <!-- 加载应用脚本 -->
    <script src="web-main.js"></script>
</body>
</html>
